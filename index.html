<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09030d">
  <meta name="description" content="GLITCHY — The Arcade That Never Died.">
  <title>GLITCHY</title>
  <link rel="preload" as="image" href="assets/poster.jpg">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="stage" aria-label="GLITCHY landing page">
    <video class="background-video" autoplay muted loop playsinline preload="metadata" poster="assets/poster.jpg" aria-hidden="true">
      <source src="assets/glitchy-bg.mp4" type="video/mp4">
    </video>
    <div class="soft-shade" aria-hidden="true"></div>

    <!-- Keep the logo visible in the video; no duplicate title is added here. -->
    <section class="overlay" aria-label="Contract address and social links">
      <div class="contract" aria-label="Contract address">
        <div class="contract-content">
          <span class="contract-label">CONTRACT ADDRESS</span>
          <span class="contract-value" id="contractValue">—</span>
        </div>
        <button class="copy-button" id="copyButton" type="button" disabled aria-label="Copy contract address" title="Contract address not set">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
        </button>
      </div>
      <nav class="socials" aria-label="Social links">
        <a class="social-link" id="xLink" href="https://x.com/GlitchyWorld" target="_blank" rel="noopener noreferrer" aria-label="GLITCHY on X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3l-5-7.5L5.3 22H2.1l7.3-8.5L1.8 2h6.5l4.5 6.9L18.9 2Zm-1.1 18h1.7L7.4 3.9H5.6L17.8 20Z"/></svg>
          <span>X</span>
        </a>
        <a class="social-link unavailable" id="telegramLink" aria-disabled="true" tabindex="-1" title="Telegram URL not configured">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.6 3.3a1.3 1.3 0 0 0-1.3-.2L2.8 10.1c-1.2.5-1.2 1.4.1 1.8l4.6 1.4 1.8 5.7c.3.9.8 1.1 1.5.5l2.6-2.5 4.6 3.4c.8.5 1.5.3 1.7-.8L22 4.5c.1-.5 0-.9-.4-1.2ZM9.4 12.7l8.9-6.1-7.1 7.6-.4 3.1-1.4-4.6Z"/></svg>
          <span>Telegram</span>
        </a>
        <a class="social-link unavailable" id="githubLink" aria-disabled="true" tabindex="-1" title="GitHub URL not configured">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.9c-2.9.6-3.5-1.2-3.5-1.2-.5-1.2-1.2-1.5-1.2-1.5-1-.7.1-.7.1-.7 1.1.1 1.6 1.1 1.6 1.1 1 .1 1.6-.4 2-.8.1-.7.4-1.1.7-1.4-2.3-.3-4.8-1.2-4.8-5.2 0-1.2.4-2.1 1.1-2.9-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10.4 10.4 0 0 1 5.4 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.9 0 4-2.5 4.9-4.9 5.2.4.4.7 1 .7 2V21c0 .3.2.6.7.5A10 10 0 0 0 12 2Z"/></svg>
          <span>GitHub</span>
        </a>
      </nav>
      <span class="sr-only" id="feedback" role="status" aria-live="polite"></span>
    </section>
  </main>
  <script src="assets/app.js" defer></script>
</body>
</html>
